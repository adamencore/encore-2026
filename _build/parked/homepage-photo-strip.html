<!-- ============ SCRIPT ============ -->
<script>
/* hero strip: inner parallax + slide-away on scroll */
(function(){
  var strip=document.querySelector('.nh-strip'); if(!strip) return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var hero=document.querySelector('.nh-hero')||strip.parentNode;
  var figs=[].slice.call(strip.querySelectorAll(':scope > figure'));
  var imgs=figs.map(function(f){return f.querySelector('img');});
  var back=strip.querySelector('.nh-strip-back');
  var paraF=[0.14,0.20,0.10,0.22,0.13,0.18];   /* inner-image parallax rate per card */
  var side=[-1,-1,-1,1,1,1];                    /* left half slides left, right half slides right */
  var dist=[2.5,1.5,0.5,0.5,1.5,2.5];           /* distance from center -> outer travels furthest */
  var ticking=false;
  function onScroll(){ if(!ticking){ticking=true;requestAnimationFrame(update);} }
  function update(){
    ticking=false;
    var scrolled=window.pageYOffset||document.documentElement.scrollTop||0;
    var hH=hero.offsetHeight||700;
    var prog=Math.min(1,Math.max(0,scrolled/(hH*0.9)));   /* 0 at top -> 1 once hero is scrolled past */
    var top=strip.getBoundingClientRect().top;
    for(var i=0;i<figs.length;i++){
      if(imgs[i]){
        var py=top*(paraF[i]||0.15); if(py>58)py=58; if(py<-58)py=-58;
        imgs[i].style.transform='translate3d(0,'+py.toFixed(1)+'px,0)';
      }
      var fx=side[i]*(380+dist[i]*220)*prog;   /* part outward from the middle */
      var sc=1+prog*0.6;                        /* cards grow as they part */
      figs[i].style.transform='translate3d('+fx.toFixed(1)+'px,0,0) scale('+sc.toFixed(3)+')';
    }
    if(back){
      var bo=Math.min(1,prog*2.2);                 /* reveal reaches full BEFORE front clears */
      var bs=1.12-Math.min(prog,0.6)/0.6*0.12;     /* gentle zoom-settle 1.12 -> 1 */
      back.style.opacity=bo.toFixed(3);
      back.style.transform='scale('+bs.toFixed(3)+')';
    }
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll,{passive:true});
  update();
})();
</script>
